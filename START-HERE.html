<style>
:root {
  --bg: #171c2a;
  --panel: #22283b;
  --panel-2: #2b3349;
  --line: #3a445e;
  --text: #e8ecf5;
  --muted: #9aa5bd;
  --accent: #4f94f1;
  --accent-2: #3b7ad6;
  --warn: #f2b84b;
  --bad: #f26d6d;
  --good: #5fd08a;
  --radius: 8px;
  color-scheme: dark;
}

* { box-sizing: border-box; }

[hidden] { display: none !important; }

html, body { height: 100%; margin: 0; }

body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  overflow: hidden;
}

button, input, select, textarea { font: inherit; color: inherit; }

button {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover { border-color: var(--accent); }
button:disabled { opacity: 0.45; cursor: default; border-color: var(--line); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primary:hover { background: var(--accent-2); }
button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
button.wide { width: 100%; }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

input[type="number"], input[type="text"], input[type="search"], select {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 6px;
  min-width: 0;
}
input[type="number"], input[type="search"] { width: 100%; }
input[type="range"] { width: 100%; min-width: 0; accent-color: var(--accent); }
input[type="color"] {
  width: 44px; height: 32px; padding: 0; border: 1px solid var(--line); border-radius: 6px;
  background: none; cursor: pointer;
}

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.brand img { width: 24px; height: 24px; image-rendering: pixelated; }
.tools, .actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.actions { margin-left: auto; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
.pill { padding: 4px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.pill.warn { color: var(--warn); border-color: var(--warn); }
.pill.bad { color: var(--bad); border-color: var(--bad); }

/* ---------- layout ---------- */
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 288px minmax(0, 1fr) 304px; }
.panel { background: var(--panel); overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
#left { border-right: 1px solid var(--line); }
#inspector { border-left: 1px solid var(--line); }
.panel h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.panel h3 { margin: 12px 0 6px; font-size: 13px; }
.panel h3 small { color: var(--muted); font-weight: 400; }
.muted { color: var(--muted); margin: 6px 0; }
.grow { flex: 1; }

.stage { position: relative; min-width: 0; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hint {
  position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px); color: #dfe5f3; font-size: 12px;
  pointer-events: none; background: #0d111cb8; border-radius: 6px; padding: 3px 8px;
}
.playing {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  background: #000a; border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; pointer-events: none;
}
.toast {
  position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); max-width: calc(100% - 24px);
  background: #0d111cf2; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px;
  padding: 7px 12px; pointer-events: none; text-align: center;
}
.toast.warn { border-left-color: #ff6b6b; }
.fatal { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); }

/* ---------- shape library ---------- */
.shape-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 6px 0; }
.shape-tabs button { padding: 4px 2px; font-size: 12.5px; }
/* The grid scrolls by itself, so the scene list below stays in reach however many shapes there are. */
.shape-grid {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; align-content: start;
  max-height: min(322px, 46vh); overflow-y: auto; scrollbar-width: thin; padding: 2px; margin: 0 -2px;
}
.shape-grid button {
  padding: 4px 1px 3px; display: flex; flex-direction: column; align-items: center; gap: 1px;
  font-size: 10.5px; line-height: 1.1; white-space: normal; overflow-wrap: anywhere; min-width: 0;
}
.shape-grid canvas { width: 44px; height: 44px; }
.shape-note { font-size: 12px; margin: 6px 0 0; }

/* ---------- scene list ---------- */
.objects { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.objects li {
  display: flex; align-items: center; gap: 6px; padding: 5px 6px; border: 1px solid transparent;
  border-radius: 6px; background: var(--panel-2); cursor: pointer;
}
.objects li:hover { border-color: var(--line); }
.objects li.selected { border-color: var(--accent); background: #2d3d5e; }
.objects li.hidden .name { opacity: 0.45; text-decoration: line-through; }
.objects .tex { width: 20px; height: 20px; image-rendering: pixelated; border-radius: 3px; flex: none; }
.objects .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.objects .n { color: var(--muted); font-size: 12px; }
.objects button { padding: 1px 6px; font-size: 12px; background: transparent; border-color: transparent; color: var(--muted); }
.objects button:hover { color: var(--text); border-color: var(--line); }

/* ---------- inspector ---------- */
.group { border-top: 1px solid var(--line); padding-top: 10px; }
.group:first-child { border-top: 0; padding-top: 0; }
.row { display: grid; grid-template-columns: 70px minmax(0, 1fr); align-items: center; gap: 8px; margin: 6px 0; }
.row > label, .row > span.l { color: var(--muted); font-size: 13px; }
.row .pair { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 6px; align-items: center; }
.row .xyz { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.row .inline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row .seconds { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: center; }
.row .seconds .note { margin: 0; }
.axis { position: relative; }
.axis::before { content: attr(data-axis); position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: 11px; font-weight: 700; pointer-events: none; }
.axis[data-axis="X"]::before { color: #ff7b7b; }
.axis[data-axis="Y"]::before { color: #7fe07f; }
.axis[data-axis="Z"]::before { color: #7bb4ff; }
.axis input { padding-left: 17px; padding-right: 3px; appearance: textfield; -moz-appearance: textfield; }
.axis input::-webkit-outer-spin-button, .axis input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.note { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
.buttons { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.buttons button { flex: 1; padding: 5px 6px; font-size: 13px; }

.tex-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.tex-grid button { padding: 4px; aspect-ratio: 1; display: grid; place-items: center; position: relative; background: #3b4664; }
.tex-grid img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; }
.tex-grid button.on { background: var(--accent); }
.tex-grid .approx { position: absolute; top: 0; right: 2px; font-size: 10px; color: var(--warn); font-weight: 700; }
.tex-name { margin: 6px 0 0; font-size: 13px; }
.tex-name code { background: var(--bg); padding: 1px 6px; border-radius: 4px; }

.swatches { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 6px; }
.swatches button { padding: 0; aspect-ratio: 1; border-radius: 4px; border: 1px solid #0006; }
.swatches button:hover { transform: scale(1.15); border-color: #fff; }

/* ---------- export dialog ---------- */
dialog {
  width: min(880px, 96vw); max-height: 94vh; padding: 0; border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); color: var(--text);
}
dialog::backdrop { background: #000a; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; font-size: 17px; }
.dialog-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.export-options { display: flex; gap: 14px; flex-wrap: wrap; align-items: end; }
.export-options label, .world-pos { display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: 12px; }
.unit { display: flex; align-items: center; gap: 5px; color: var(--muted); }
.unit input { width: 76px; }
.status { display: flex; flex-direction: column; gap: 4px; }
.status p { margin: 0; padding: 6px 10px; border-radius: 6px; background: var(--bg); border-left: 3px solid var(--good); }
.status p.warn { border-left-color: var(--warn); }
.status p.bad { border-left-color: var(--bad); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs:empty { display: none; }
#ex-code {
  width: 100%; height: 34vh; min-height: 160px; resize: vertical; background: #0f1320; border: 1px solid var(--line);
  border-radius: 8px; padding: 10px; font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre;
}
.export-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meter { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter b { color: var(--text); }
.steps { margin: 0; padding-left: 20px; color: var(--muted); }
.steps li { margin: 2px 0; }
.steps b, .steps code { color: var(--text); }

/* ---------- timeline: one row per object, time runs to the right ---------- */
.timeline { flex: none; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--line); }
.tl-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; flex-wrap: wrap; }
.tl-bar button { padding: 4px 9px; }
.tl-bar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.tl-bar input[type="number"] { width: 74px; color: var(--text); }
.tl-bar select { color: var(--text); }
#tl-total { min-width: 44px; }
.tl-hint { flex: 1; min-width: 120px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-zoom button { width: 30px; padding: 4px 0; }
.tl-scroll { position: relative; overflow: auto; height: 132px; background: var(--bg); border-top: 1px solid var(--line); }
.tl-canvas { position: relative; min-height: 100%; --names: 120px; }
.tl-ruler {
  position: sticky; top: 0; z-index: 3; height: 22px; background: var(--panel-2); border-bottom: 1px solid var(--line);
  cursor: ew-resize; touch-action: none; user-select: none;
}
.tl-ruler .tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); padding-left: 4px; font-size: 11px; line-height: 21px; color: var(--muted); pointer-events: none; }
.tl-ruler .tick.small { top: 14px; }
.tl-ruler::before, .tl-row .tl-name {
  position: sticky; left: 0; z-index: 2; width: var(--names); background: var(--panel-2); border-right: 1px solid var(--line);
}
.tl-ruler::before { content: "seconds"; display: block; box-sizing: border-box; height: 100%; padding: 0 8px; font-size: 11px; line-height: 21px; color: var(--muted); }
.tl-row { position: relative; height: 26px; border-bottom: 1px solid #262d40; touch-action: pan-y; user-select: none; }
.tl-row:hover { background: #1c2233; }
.tl-row.selected { background: #232d45; }
.tl-row.hidden { opacity: 0.45; }
.tl-row .tl-name {
  display: block; height: 100%; padding: 0 8px; line-height: 25px; font-size: 12px; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tl-row.selected .tl-name { background: #2d3d5e; color: #fff; }
.tl-span {
  position: absolute; top: 5px; height: 16px; min-width: 4px; border-radius: 4px; cursor: grab;
  background: #4a5878; border: 1px solid #6b7da6;
}
.tl-row.selected .tl-span { background: var(--accent-2); border-color: #9cc4ff; }
.tl-span.fade-in { -webkit-mask-image: linear-gradient(to right, #0003, #000 20%); mask-image: linear-gradient(to right, #0003, #000 20%); }
.tl-span.fade-out { -webkit-mask-image: linear-gradient(to right, #000 80%, #0003); mask-image: linear-gradient(to right, #000 80%, #0003); }
.tl-span.fade-in.fade-out { -webkit-mask-image: linear-gradient(to right, #0003, #000 20%, #000 80%, #0003); mask-image: linear-gradient(to right, #0003, #000 20%, #000 80%, #0003); }
.tl-end { position: absolute; top: 3px; width: 9px; height: 20px; margin-left: -5px; cursor: ew-resize; z-index: 1; }
.tl-end::after { content: ""; position: absolute; left: 3px; top: 3px; bottom: 3px; width: 3px; border-radius: 2px; background: #c9d6f2; }
.tl-key {
  position: absolute; top: 7px; width: 12px; height: 12px; margin-left: -6px; padding: 0; border-radius: 2px; z-index: 1;
  transform: rotate(45deg); background: #ffd24a; border: 1px solid #5c4a10; cursor: ew-resize;
}
.tl-key.first { background: #c9d6f2; border-color: #46506a; cursor: pointer; }
.tl-key.on { background: #fff; box-shadow: 0 0 0 2px var(--accent); }
.tl-key:hover { border-color: #fff; }
.tl-head { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid #ff6b6b; z-index: 4; pointer-events: none; }
.tl-head::before {
  content: ""; position: sticky; top: 0; display: block; width: 12px; height: 12px; margin-left: -7px;
  background: #ff6b6b; border-radius: 2px 2px 7px 7px;
}

/* ---------- small screens ---------- */
@media (max-width: 900px) {
  body { overflow: auto; }
  /* one column: the 3D view, the timeline right under it, then the two panels */
  .layout { display: contents; }
  .stage { order: 1; flex: none; height: 52vh; height: max(260px, 52dvh); }
  .timeline { order: 2; }
  #left { order: 3; }
  #inspector { order: 4; }
  #left, #inspector { flex: none; border: 0; border-top: 1px solid var(--line); overflow: visible; }
  .shape-tabs { grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); }
  .shape-grid { grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); max-height: 300px; }
  .actions { margin-left: 0; }
  .tl-scroll { height: 106px; }
  /* full-width panels: keep the pictures and swatches a sensible size */
  .tex-grid { grid-template-columns: repeat(auto-fill, 52px); }
  .swatches { grid-template-columns: repeat(auto-fill, 32px); }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAABhWlDQ1BJQ0MgcHJvZmlsZQAAKJF9kT1Iw1AUhU9TpSIVETsUcYhQneyiIo6likWwUNoKrTqYvPQPmjQkKS6OgmvBwZ/FqoOLs64OroIg+APi7OCk6CIl3pcUWsR44fE+zrvn8N59gNCsMtXsiQGqZhnpRFzM5VfFwCt8CGMIY/BLzNSTmcUsPOvrnrqp7qI8y7vvzxpQCiYDfCJxjOmGRbxBPLtp6Zz3iUOsLCnE58STBl2Q+JHrsstvnEsOCzwzZGTT88QhYrHUxXIXs7KhEs8QRxRVo3wh57LCeYuzWq2z9j35C4MFbSXDdVqjSGAJSaQgQkYdFVRhIUq7RoqJNJ3HPfwjjj9FLplcFTByLKAGFZLjB/+D37M1i9NTblIwDvS+2PbHOBDYBVoN2/4+tu3WCeB/Bq60jr/WBOY+SW90tMgRMLgNXFx3NHkPuNwBwk+6ZEiO5KclFIvA+xl9Ux4YvgX619y5tc9x+gBkaVbLN8DBITBRoux1j3f3dc/t3572/H4AgPByrFV9sOwAAAAGYktHRAD/AP8A/6C9p5MAAAAJcEhZcwAACxMAAAsTAQCanBgAAAAHdElNRQfoARgRJwfHS4sOAAAAXElEQVQ4y2NgoCW4dOnS/0uXLv3Hp4aJUktY8EkKCAgQNIBiFzDi8juyCz58+MDAwMDAoKenx0gbF6DbiB4GMBfAALKLhkEY4AWPHj36/+jRowFMieihTxMXUAwAUtspTkjkrKUAAAAASUVORK5CYII=" alt=""><span>Bloxd Particle Studio</span></div>
  <div class="tools">
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
    <span class="sep"></span>
    <div class="seg" id="modes" role="group" aria-label="Tool">
      <button data-mode="translate" title="Move (W)">Move</button>
      <button data-mode="rotate" title="Rotate (E)">Rotate</button>
      <button data-mode="scale" title="Resize (R)">Resize</button>
    </div>
    <label class="check" title="Snap to quarter blocks, 15 degrees"><input type="checkbox" id="snap"> Snap</label>
    <span class="sep"></span>
    <button id="play" title="Play what happens when the block is clicked (Space)">Play</button>
    <button id="focus" title="Center the view (F)">Center</button>
    <label class="check" title="Daylight background"><input type="checkbox" id="sky"> Sky</label>
  </div>
  <div class="actions">
    <span id="count" class="pill">0 particles</span>
    <button id="new">New</button>
    <button id="open" title="Open a saved scene file">Open</button>
    <button id="save" title="Save the scene as a file">Save</button>
    <button id="export" class="primary">Export code</button>
  </div>
</header>

<main class="layout">
  <aside class="panel" id="left">
    <section>
      <h2>Add</h2>
      <button id="add-point" class="wide">+ Single particle</button>
      <h3>Shapes <small>made of many particles</small></h3>
      <input id="shape-search" type="search" placeholder="Search shapes" aria-label="Search shapes" autocomplete="off" spellcheck="false">
      <div id="shape-tabs" class="shape-tabs" role="group" aria-label="Kinds of shape"></div>
      <div id="shapes" class="shape-grid" role="group" aria-label="Shapes to add"></div>
      <p id="shape-note" class="muted shape-note" aria-live="polite" hidden></p>
    </section>
    <section class="grow">
      <h2>Scene</h2>
      <ul id="objects" class="objects"></ul>
